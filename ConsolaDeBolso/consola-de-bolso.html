<title>Consola de Bolso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F2F3F5;
    --surface:#FFFFFF;
    --surface-2:#E9EBEF;
    --ink:#161A20;
    --ink-soft:#525A66;
    --ink-faint:#878F9C;
    --line:#DDE0E6;
    --console-bg:#12151B;
    --console-ink:#E8EAF0;
    --console-dim:#7E8899;
    --git:#E8552D;
    --git-tint:#FBE7E1;
    --gitlab:#D4551A;
    --gitlab-tint:#FBE8DC;
    --docker:#1B6FC4;
    --docker-tint:#DEEAF7;
    --good:#25795A;
    --good-tint:#DCEDE5;
    --bad:#A83A2C;
    --bad-tint:#F7E2DE;
    --star:#B5851F;
    --shadow:0 1px 2px rgba(15,20,28,.05), 0 10px 26px -14px rgba(15,20,28,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1216;
      --surface:#181C22;
      --surface-2:#222831;
      --ink:#EDEFF3;
      --ink-soft:#9BA4B1;
      --ink-faint:#6C7583;
      --line:#2A313A;
      --console-bg:#0A0C10;
      --console-ink:#E8EAF0;
      --console-dim:#79839A;
      --git:#FF7B57;
      --git-tint:#33201A;
      --gitlab:#F5813E;
      --gitlab-tint:#331F14;
      --docker:#63A8E8;
      --docker-tint:#152738;
      --good:#5CBE95;
      --good-tint:#12301F;
      --bad:#E28878;
      --bad-tint:#361F1B;
      --star:#DEB055;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1216;
    --surface:#181C22;
    --surface-2:#222831;
    --ink:#EDEFF3;
    --ink-soft:#9BA4B1;
    --ink-faint:#6C7583;
    --line:#2A313A;
    --console-bg:#0A0C10;
    --console-ink:#E8EAF0;
    --console-dim:#79839A;
    --git:#FF7B57;
    --git-tint:#33201A;
    --gitlab:#F5813E;
    --gitlab-tint:#331F14;
    --docker:#63A8E8;
    --docker-tint:#152738;
    --good:#5CBE95;
    --good-tint:#12301F;
    --bad:#E28878;
    --bad-tint:#361F1B;
    --star:#DEB055;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Manrope", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono, code{ font-family:"JetBrains Mono", ui-monospace, monospace; }

  .app{
    max-width:480px; margin:0 auto;
    min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column; position:relative;
    background:var(--paper);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper); border-bottom:1px solid var(--line);
    padding:10px 14px 9px; padding-top:calc(10px + env(safe-area-inset-top));
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .topbar h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.02em; }
  .xp-pill{
    display:flex; align-items:center; gap:5px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:20px;
    padding:5px 11px; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .xp-pill b{ font-family:"JetBrains Mono"; color:var(--star); }
  .sync-dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-faint); cursor:pointer; flex:none; }
  .sync-dot.good{ background:var(--good); }
  .sync-dot.warn{ background:var(--star); }

  .tabbar{
    display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:3px; margin-top:9px;
  }
  .tab{
    flex:1; text-align:center; padding:8px 4px; border-radius:8px;
    color:var(--ink-soft); font-size:12.5px; font-weight:700;
    cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap;
  }
  .tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .content{ flex:1; padding:14px; }

  /* Trilhos e missoes */
  .track-head{ display:flex; align-items:center; gap:9px; margin:18px 2px 9px; }
  .track-head:first-child{ margin-top:2px; }
  .track-badge{
    font-family:"JetBrains Mono"; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:6px;
  }
  .track-badge.git{ background:var(--git-tint); color:var(--git); }
  .track-badge.gitlab{ background:var(--gitlab-tint); color:var(--gitlab); }
  .track-badge.docker{ background:var(--docker-tint); color:var(--docker); }
  .track-title{ flex:1; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .track-progress{ font-family:"JetBrains Mono"; font-size:12px; color:var(--ink-faint); }

  .mission-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:12px; margin-bottom:8px; box-shadow:var(--shadow);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .mission-card.locked{ opacity:.55; cursor:default; }
  .mission-num{
    flex:none; width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono"; font-weight:700; font-size:14px;
  }
  .mission-num.git{ background:var(--git-tint); color:var(--git); }
  .mission-num.gitlab{ background:var(--gitlab-tint); color:var(--gitlab); }
  .mission-num.docker{ background:var(--docker-tint); color:var(--docker); }
  .mission-main{ flex:1; min-width:0; }
  .mission-title{ font-size:14.5px; font-weight:700; }
  .mission-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stars{ flex:none; font-size:13px; color:var(--star); letter-spacing:1px; }
  .stars .off{ color:var(--line); }
  .lock{ flex:none; color:var(--ink-faint); font-size:15px; }

  /* Ecra da missao */
  .brief{
    background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .brief h2{ font-size:17px; font-weight:800; margin:0 0 6px; }
  .brief p{ margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-soft); }
  .goal{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    font-size:13px; color:var(--ink);
  }
  .goal b{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:3px; }

  /* Visualizacao do estado */
  .zones{ display:flex; gap:6px; margin-bottom:12px; }
  .zone{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:9px 8px; min-height:92px;
  }
  .zone.active{ border-color:var(--git); box-shadow:0 0 0 2px var(--git-tint); }
  .zone-name{
    font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:800; margin-bottom:6px; text-align:center;
  }
  .chip{
    display:block; font-family:"JetBrains Mono"; font-size:10.5px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:5px;
    padding:3px 5px; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip.new{ border-color:var(--git); color:var(--git); }
  .chip.staged{ border-color:var(--star); color:var(--star); }
  .chip.commit{ border-color:var(--good); color:var(--good); }
  .chip.img{ border-color:var(--docker); color:var(--docker); }
  .chip.run{ border-color:var(--good); color:var(--good); }
  .chip.stopped{ border-color:var(--ink-faint); color:var(--ink-faint); }
  .zone-empty{ font-size:10.5px; color:var(--ink-faint); text-align:center; padding-top:6px; }

  .state-extra{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;
  }
  .state-tag{
    font-family:"JetBrains Mono"; font-size:11px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
    padding:4px 8px; color:var(--ink-soft);
  }
  .state-tag.ok{ background:var(--good-tint); border-color:var(--good); color:var(--good); }
  .state-tag.fail{ background:var(--bad-tint); border-color:var(--bad); color:var(--bad); }

  /* Consola */
  .console{
    background:var(--console-bg); border-radius:12px; padding:11px 12px;
    font-family:"JetBrains Mono"; font-size:11.5px; line-height:1.6;
    color:var(--console-ink); margin-bottom:12px;
    max-height:190px; overflow-y:auto;
  }
  .console .cmd{ color:var(--console-ink); }
  .console .cmd::before{ content:"$ "; color:var(--git); }
  .console .out{ color:var(--console-dim); white-space:pre-wrap; }
  .console .err{ color:#E8836F; }
  .console .ok{ color:#6FCF9F; }

  /* Passo actual */
  .step-box{
    background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:13px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .step-count{
    font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:800; margin-bottom:5px;
  }
  .step-ask{ font-size:14.5px; font-weight:700; line-height:1.4; }
  .step-hint{
    margin-top:9px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;
    background:var(--surface-2); border-radius:8px; padding:9px 10px;
  }
  .feedback{
    margin-top:10px; border-radius:9px; padding:10px 11px;
    font-size:13px; line-height:1.55;
  }
  .feedback.ok{ background:var(--good-tint); color:var(--good); border:1px solid var(--good); }
  .feedback.no{ background:var(--bad-tint); color:var(--bad); border:1px solid var(--bad); }
  .feedback code{ background:rgba(0,0,0,.08); padding:1px 4px; border-radius:4px; }

  /* Construtor de comandos */
  .cmdline{
    background:var(--console-bg); border-radius:10px 10px 0 0;
    padding:11px 12px; font-family:"JetBrains Mono"; font-size:13px;
    color:var(--console-ink); min-height:42px; display:flex; align-items:center; gap:6px;
    overflow-x:auto; white-space:nowrap;
  }
  .cmdline .prompt{ color:var(--git); flex:none; }
  .cmdline .empty{ color:var(--console-dim); }
  .cmdline .caret{
    display:inline-block; width:7px; height:15px; background:var(--console-ink);
    animation:blink 1.1s steps(1) infinite; flex:none;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .cmdline .caret{ animation:none; } }

  .cmd-actions{
    display:flex; gap:6px; background:var(--console-bg);
    border-radius:0 0 10px 10px; padding:0 8px 8px; margin-bottom:10px;
  }
  .cmd-actions button{
    flex:1; border-radius:8px; padding:9px; font-size:12.5px; font-weight:700;
    font-family:inherit; cursor:pointer; border:none;
  }
  .btn-run{ background:var(--good); color:#fff; }
  .btn-run:disabled{ opacity:.4; }
  .btn-clear{ background:#2A303B; color:#C7CEDA; flex:0 0 88px !important; }

  .token-groups{ display:flex; flex-direction:column; gap:8px; }
  .token-group{ }
  .token-group-name{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:800; margin-bottom:5px;
  }
  .tokens{ display:flex; flex-wrap:wrap; gap:6px; }
  .token{
    font-family:"JetBrains Mono"; font-size:12.5px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    color:var(--ink); box-shadow:var(--shadow);
  }
  .token:active{ background:var(--surface-2); }
  .token.cmd{ border-color:var(--git); color:var(--git); font-weight:700; }
  .token.cmd.docker{ border-color:var(--docker); color:var(--docker); }
  .token.flag{ color:var(--ink-soft); }

  .mission-done{
    background:var(--good-tint); border:1px solid var(--good); border-radius:13px;
    padding:16px; text-align:center; margin-bottom:12px;
  }
  .mission-done h3{ margin:0 0 4px; font-size:18px; font-weight:800; color:var(--good); }
  .mission-done p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.55; }
  .mission-done .stars-big{ font-size:26px; color:var(--star); letter-spacing:3px; margin:8px 0; }
  .mission-done .stars-big .off{ color:var(--line); }

  .btn-primary{
    width:100%; background:var(--ink); color:var(--paper); border:none; border-radius:11px;
    padding:13px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn-secondary{
    width:100%; background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--line); border-radius:11px;
    padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:8px;
  }

  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    color:var(--ink-soft); cursor:pointer; margin-bottom:10px;
  }

  /* Glossario */
  .gloss-item{
    background:var(--surface); border:1px solid var(--line); border-radius:11px;
    padding:11px 12px; margin-bottom:7px; box-shadow:var(--shadow);
  }
  .gloss-cmd{ font-family:"JetBrains Mono"; font-size:13px; font-weight:700; color:var(--ink); }
  .gloss-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }
  .gloss-filter{ display:flex; gap:6px; margin-bottom:12px; }
  .gloss-filter div{
    flex:1; text-align:center; padding:8px; border-radius:9px; font-size:12.5px; font-weight:700;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .gloss-filter div.active.git{ background:var(--git-tint); border-color:var(--git); color:var(--git); }
  .gloss-filter div.active.gitlab{ background:var(--gitlab-tint); border-color:var(--gitlab); color:var(--gitlab); }
  .gloss-filter div.active.docker{ background:var(--docker-tint); border-color:var(--docker); color:var(--docker); }

  .empty-state{
    border:1px dashed var(--line); border-radius:13px; padding:24px 18px;
    text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.55;
  }
  .hint{ font-size:12px; color:var(--ink-faint); line-height:1.5; }
</style>

<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  function showDebugError(msg){
    var el = document.getElementById("debugError");
    if (!el){
      el = document.createElement("div");
      el.id = "debugError";
      el.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#A83A2C;color:#fff;padding:10px 12px;border-radius:10px;font-size:11.5px;font-family:ui-monospace,monospace;white-space:pre-wrap;max-height:42vh;overflow:auto;";
      document.body.appendChild(el);
    }
    el.textContent += (el.textContent ? "\n\n" : "") + msg;
  }
  window.addEventListener("error", function(e){
    showDebugError("Erro: " + (e.message || e) + (e.lineno ? (" (linha " + e.lineno + ")") : ""));
  });

  // ================= conteudo =================
  // Cada missao tem passos; cada passo aceita um ou mais comandos escritos
  // da forma correcta, e sabe explicar os enganos mais comuns.

  var TRACKS = {
    git:    { label:"Git e GitHub", cls:"git",    desc:"Do primeiro commit ao pull request" },
    gitlab: { label:"GitLab",       cls:"gitlab", desc:"Merge requests e pipelines" },
    docker: { label:"Docker",       cls:"docker", desc:"Imagens, contentores e compose" }
  };

  function gitState(extra){
    var base = {
      kind:"git", repo:false, work:[], stage:[], commits:[], remote:null, remoteCommits:0,
      branch:"main", branches:["main"], pr:null, pipeline:null, conflict:false
    };
    for (var k in extra) base[k] = extra[k];
    return base;
  }
  function dockerState(extra){
    var base = { kind:"docker", images:[], containers:[], compose:false, dockerfile:false };
    for (var k in extra) base[k] = extra[k];
    return base;
  }

  var MISSIONS = [
    // ---------------- GIT ----------------
    {
      id:"git1", track:"git", title:"O primeiro commit",
      brief:"Tens uma pasta com o teu projeto no computador. Ainda nao esta em Git nenhum. Vamos transformar a pasta num repositorio e guardar a primeira versao.",
      goal:"Ficar com um commit feito no repositorio local.",
      initial: gitState({ work:["index.html","style.css"] }),
      tokens:[
        { name:"comando", items:[{t:"git",cls:"cmd"}] },
        { name:"subcomando", items:[{t:"init"},{t:"status"},{t:"add"},{t:"commit"},{t:"push"},{t:"log"}] },
        { name:"argumentos", items:[{t:"."},{t:"index.html"},{t:'-m "primeira versao"',cls:"flag"},{t:"-a",cls:"flag"}] }
      ],
      steps:[
        {
          ask:"Transforma esta pasta num repositorio Git.",
          accept:["git init"],
          hint:"O comando que arranca um repositorio novo tem o nome de inicializar.",
          explain:"git init cria a pasta escondida .git, onde fica todo o historico. A partir daqui o Git passa a olhar para esta pasta.",
          wrong:{ "git status":"Ainda nao ha repositorio nenhum para consultar. Primeiro cria o repositorio.",
                  "git add .":"Nao podes adicionar ficheiros a um repositorio que ainda nao existe." },
          apply:function(s){ s.repo = true; return "Initialized empty Git repository in ./.git/"; }
        },
        {
          ask:"Ve em que estado estao os teus ficheiros.",
          accept:["git status"],
          hint:"E o comando que usas mais vezes no dia a dia, para saber onde estas.",
          explain:"git status mostra o que mudou e em que zona esta. Repara que os dois ficheiros aparecem como untracked, ou seja, o Git ainda nao os segue.",
          wrong:{ "git log":"Ainda nao ha commits nenhuns para mostrar no historico." },
          apply:function(s){ return "Untracked files:\n  index.html\n  style.css"; }
        },
        {
          ask:"Poe os dois ficheiros prontos a serem guardados.",
          accept:["git add .","git add index.html style.css"],
          hint:"O ponto significa tudo o que esta nesta pasta.",
          explain:"git add move os ficheiros para a staging area, a zona de espera. Ainda nao guardaste nada no historico: so escolheste o que vai entrar no proximo commit.",
          wrong:{ "git commit -m \"primeira versao\"":"Um commit so guarda o que esta em staging, e por agora essa zona esta vazia. Primeiro tens de adicionar." },
          apply:function(s){ s.stage = s.work.slice(); s.work = []; return "2 ficheiros adicionados a staging"; }
        },
        {
          ask:"Guarda esta versao no historico, com uma mensagem.",
          accept:['git commit -m "primeira versao"'],
          hint:"Um commit sem mensagem nao passa. A mensagem vai a seguir a -m.",
          explain:"O commit e um ponto de gravacao no historico, so no teu computador. O -m escreve a mensagem ali mesmo; sem ele, o Git abre um editor de texto a pedi-la.",
          wrong:{ "git commit":"Sem -m o Git abre um editor de texto para escreveres a mensagem, o que no telemovel seria uma armadilha. Usa -m com a mensagem.",
                  "git push":"Ainda nao ha nada para enviar, e tambem ainda nao ha servidor configurado." },
          apply:function(s){ s.commits.push("primeira versao"); s.stage = []; return "[main (root-commit)] primeira versao\n 2 files changed"; }
        }
      ],
      lesson:"Ficheiros passam por tres zonas: pasta de trabalho, staging (git add) e repositorio local (git commit). Nada disto saiu ainda do teu computador."
    },
    {
      id:"git2", track:"git", title:"Enviar para o GitHub",
      brief:"O teu commit esta so no portatil. Se ele se estragar hoje, perdes tudo. Vamos ligar o repositorio ao GitHub e enviar o trabalho.",
      goal:"Ter o commit tambem no GitHub.",
      initial: gitState({ repo:true, commits:["primeira versao"] }),
      tokens:[
        { name:"comando", items:[{t:"git",cls:"cmd"}] },
        { name:"subcomando", items:[{t:"remote"},{t:"push"},{t:"pull"},{t:"clone"},{t:"status"}] },
        { name:"argumentos", items:[{t:"add origin"},{t:"git@github.com:afonso/projeto.git"},{t:"origin"},{t:"main"},{t:"-u",cls:"flag"}] }
      ],
      steps:[
        {
          ask:"Diz ao Git onde fica o repositorio no GitHub. Ja criaste la o repositorio vazio.",
          accept:["git remote add origin git@github.com:afonso/projeto.git"],
          hint:"Comeca por git remote, depois add origin, depois o endereco.",
          explain:"origin e apenas um nome curto para o endereco do servidor. Podia chamar-se outra coisa, mas por convencao chama-se origin.",
          wrong:{ "git clone git@github.com:afonso/projeto.git":"O clone serve para trazer um repositorio que ja existe la para o teu computador. Aqui e o contrario: ja tens o repositorio local e queres liga-lo ao servidor." },
          apply:function(s){ s.remote = "github"; return "remote origin adicionado"; }
        },
        {
          ask:"Envia o teu ramo main para o GitHub, deixando-o associado.",
          accept:["git push -u origin main"],
          hint:"O -u faz a ligacao entre o teu ramo local e o do servidor, para depois bastar escrever git push.",
          explain:"push envia os teus commits para o servidor. O -u (de upstream) guarda a associacao, e por isso das proximas vezes basta git push.",
          wrong:{ "git push":"Ainda nao existe associacao entre o teu ramo e o servidor, por isso o Git nao sabe para onde enviar. Da-lhe origin e main, com -u.",

  // ================= estado =================
  var progress = {};              // { missaoId: { stars, done } }
  var ui = { tab:"missoes", mission:null, glossTrack:"git", cloudMode:null };
  var cloudDb = null, storeReady = false;
  var STORAGE_KEY = "consoladebolso.v1";

  // estado da missao em curso
  var run = null; // { mission, state, stepIndex, tokens:[], log:[], errors, hintsUsed, feedback, done }

  function persist(){
    if (!storeReady || ui.cloudMode) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ progress:progress })); } catch(e){}
  }

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){ if (done) return; done = true; reject({ code:"timeout" }); }, ms);
      promise.then(function(v){ if (done) return; done = true; clearTimeout(timer); resolve(v); },
                   function(e){ if (done) return; done = true; clearTimeout(timer); reject(e); });
    });
  }

  function saveProgress(){
    if (ui.cloudMode && cloudDb){
      withTimeout(cloudDb.doc("progress/main").set({ progress:progress }), 8000).catch(function(){
        ui.cloudMode = false; storeReady = true; persist();
      });
    } else {
      persist();
    }
  }

  function initApp(){
    render();
    if (!(window.claude && window.claude.use)){ setupLocal(); return; }
    window.claude.use("db").then(function(db){
      if (!db){ setupLocal(); return; }
      var settled = false;
      var timer = setTimeout(function(){ if (!settled){ settled = true; setupLocal(); } }, 6000);
      db.doc("progress/main").get().then(function(snap){
        if (settled) return;
        settled = true; clearTimeout(timer);
        cloudDb = db; ui.cloudMode = true;
        var data = snap.exists ? snap.data() : null;
        if (data && data.progress){
          var p = {};
          for (var k in data.progress) p[k] = data.progress[k]; // vem congelado
          progress = p;
        }
        db.doc("progress/main").onSnapshot(function(s){
          if (!ui.cloudMode || !s.exists) return;
          var d = s.data();
          if (!d || !d.progress) return;
          var copy = {};
          for (var key in d.progress) copy[key] = d.progress[key];
          progress = copy;
          if (!run) render();
        }, function(){});
        render();
      }).catch(function(){
        if (settled) return;
        settled = true; clearTimeout(timer);
        setupLocal();
      });
    }).catch(function(){ setupLocal(); });
  }

  function setupLocal(){
    ui.cloudMode = false;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        progress = parsed.progress || {};
      }
    } catch(e){}
    storeReady = true;
    render();
  }

  // ================= util =================
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function normalize(cmd){
    return String(cmd || "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function starsFor(errors, hints){
    if (errors === 0 && hints === 0) return 3;
    if (errors + hints <= 2) return 2;
    return 1;
  }
  function starsHtml(n, size){
    var out = "";
    for (var i=1;i<=3;i++) out += "<span class='" + (i <= n ? "" : "off") + "'>&#9733;</span>";
    return out;
  }
  function missionsOfTrack(track){
    return MISSIONS.filter(function(m){ return m.track === track; });
  }
  function totalStars(){
    var t = 0;
    for (var k in progress) t += (progress[k].stars || 0);
    return t;
  }
  function isUnlocked(mission){
    var list = missionsOfTrack(mission.track);
    var idx = list.indexOf(mission);
    if (idx <= 0) return true;
    var prev = list[idx-1];
    return !!(progress[prev.id] && progress[prev.id].done);
  }

    else if (ui.tab === "missoes") content.appendChild(renderMissionList());

  function renderMissionList(){
    var wrap = document.createDocumentFragment();

    ["git","gitlab","docker"].forEach(function(trackId){
      var track = TRACKS[trackId];
      var list = missionsOfTrack(trackId);
      var doneCount = list.filter(function(m){ return progress[m.id] && progress[m.id].done; }).length;

      var head = document.createElement("div");
      head.className = "track-head";
      head.innerHTML =
        "<span class='track-badge " + track.cls + "'>" + track.label + "</span>" +
        "<span class='track-title'>" + track.desc + "</span>" +
        "<span class='track-progress'>" + doneCount + "/" + list.length + "</span>";
      wrap.appendChild(head);

      list.forEach(function(mission, i){
        var prog = progress[mission.id];
        var unlocked = isUnlocked(mission);
        var card = document.createElement("div");
        card.className = "mission-card" + (unlocked ? "" : " locked");
        card.innerHTML =
          "<div class='mission-num " + track.cls + "'>" + (i+1) + "</div>" +
          "<div class='mission-main'>" +
            "<div class='mission-title'>" + escapeHtml(mission.title) + "</div>" +
            "<div class='mission-sub'>" + escapeHtml(unlocked ? mission.goal : "Termina a missao anterior para abrir") + "</div>" +
          "</div>" +
          (unlocked
            ? "<div class='stars'>" + starsHtml(prog ? prog.stars : 0) + "</div>"
            : "<div class='lock'>&#128274;</div>");
        if (unlocked) card.onclick = function(){ startMission(mission); };
        wrap.appendChild(card);
      });
    });

    var note = document.createElement("div");
    note.className = "hint";
    note.style.marginTop = "16px";
    note.textContent = "Os comandos sao reais. Constroi-os tocando nas pecas, nao ha nada para escrever.";
    wrap.appendChild(note);
    return wrap;
  }

  function startMission(mission){
    var initial = JSON.parse(JSON.stringify(mission.initial));
    run = {
      mission: mission, state: initial, stepIndex: 0, tokens: [],
      log: [], errors: 0, hintsUsed: 0, feedback: null, showHint: false, done: false
    };
    render();
  }

  function renderMission(){
    var wrap = document.createDocumentFragment();
    var m = run.mission;

    var back = document.createElement("div");
    back.className = "back-link";
    back.innerHTML = "&#8592; <span>Missoes</span>";
    back.onclick = function(){ run = null; render(); };
    wrap.appendChild(back);

    var brief = document.createElement("div");
    brief.className = "brief";
    brief.innerHTML =
      "<h2>" + escapeHtml(m.title) + "</h2>" +
      "<p>" + escapeHtml(m.brief) + "</p>" +
      "<div class='goal'><b>Objetivo</b>" + escapeHtml(m.goal) + "</div>";
    wrap.appendChild(brief);

    wrap.appendChild(renderState());

    if (run.log.length){
      var consoleEl = document.createElement("div");
      consoleEl.className = "console";
      consoleEl.innerHTML = run.log.map(function(entry){
        var cls = entry.type === "err" ? "err" : entry.type === "ok" ? "ok" : "out";
        return "<div class='cmd'>" + escapeHtml(entry.cmd) + "</div>" +
               (entry.out ? "<div class='" + cls + "'>" + escapeHtml(entry.out) + "</div>" : "");
      }).join("");
      wrap.appendChild(consoleEl);
      setTimeout(function(){ consoleEl.scrollTop = consoleEl.scrollHeight; }, 0);
    }

    if (run.done){
      var stars = starsFor(run.errors, run.hintsUsed);
      var doneBox = document.createElement("div");
      doneBox.className = "mission-done";
      doneBox.innerHTML =
        "<h3>Missao cumprida</h3>" +
        "<div class='stars-big'>" + starsHtml(stars) + "</div>" +
        "<p>" + escapeHtml(m.lesson) + "</p>";
      wrap.appendChild(doneBox);

      var next = nextMission(m);
      var btn = document.createElement("button");
      btn.className = "btn-primary";
      btn.textContent = next ? "Missao seguinte" : "Voltar as missoes";
      btn.onclick = function(){
        if (next) startMission(next);
        else { run = null; render(); }
      };
      wrap.appendChild(btn);

      var again = document.createElement("button");
      again.className = "btn-secondary";
      again.textContent = "Repetir esta missao";
      again.onclick = function(){ startMission(m); };
      wrap.appendChild(again);
      return wrap;
    }

    var step = m.steps[run.stepIndex];
    var stepBox = document.createElement("div");
    stepBox.className = "step-box";
    var inner =
      "<div class='step-count'>Passo " + (run.stepIndex+1) + " de " + m.steps.length + "</div>" +
      "<div class='step-ask'>" + escapeHtml(step.ask) + "</div>";
    if (run.showHint && step.hint) inner += "<div class='step-hint'>" + escapeHtml(step.hint) + "</div>";
    if (run.feedback){
      inner += "<div class='feedback " + (run.feedback.ok ? "ok" : "no") + "'>" + escapeHtml(run.feedback.text) + "</div>";
    }
    stepBox.innerHTML = inner;
    wrap.appendChild(stepBox);

    wrap.appendChild(renderBuilder());

    if (!run.showHint && step.hint){
      var hintBtn = document.createElement("button");
      hintBtn.className = "btn-secondary";
      hintBtn.textContent = "Nao sei, da-me uma pista";
      hintBtn.onclick = function(){ run.showHint = true; run.hintsUsed++; render(); };
      wrap.appendChild(hintBtn);
    }
    return wrap;
  }

  function nextMission(m){
    var idx = MISSIONS.indexOf(m);
    return idx >= 0 && idx < MISSIONS.length - 1 ? MISSIONS[idx+1] : null;
  }

  function renderState(){
    var s = run.state;
    var box = document.createDocumentFragment();
    var zones = document.createElement("div");
    zones.className = "zones";

    function zone(name, items, cls){
      var z = document.createElement("div");
      z.className = "zone";
      var html = "<div class='zone-name'>" + name + "</div>";
      if (!items.length) html += "<div class='zone-empty'>vazio</div>";
      else html += items.map(function(it){ return "<span class='chip " + cls + "'>" + escapeHtml(it) + "</span>"; }).join("");
      z.innerHTML = html;
      return z;
    }

    if (s.kind === "git"){
      zones.appendChild(zone("Trabalho", s.work, "new"));
      zones.appendChild(zone("Staging", s.stage, "staged"));
      zones.appendChild(zone("Local", s.commits.map(function(c,i){ return (i+1) + ". " + c; }), "commit"));
      zones.appendChild(zone(s.remote === "gitlab" ? "GitLab" : "GitHub",
        s.remote ? [s.remoteCommits + " commits"] : [], "commit"));
    } else {
      zones.appendChild(zone("Imagens", s.images, "img"));
      zones.appendChild(zone("Contentores", s.containers.map(function(c){
        return c.name + " " + (c.state === "a correr" ? "on" : "off");
      }), s.containers.some(function(c){ return c.state === "a correr"; }) ? "run" : "stopped"));
    }
    box.appendChild(zones);

    var tags = [];
    if (s.kind === "git"){
      if (s.repo) tags.push({ t:"ramo: " + s.branch });
      if (s.conflict) tags.push({ t:"conflito por resolver", cls:"fail" });
      if (s.pr) tags.push({ t:s.pr === "aberto" ? "PR aberto" : s.pr, cls: s.pr === "fechado" ? "ok" : "" });
      if (s.pipeline) tags.push({ t:"pipeline " + s.pipeline, cls: s.pipeline === "passou" ? "ok" : "fail" });
    } else {
      if (s.dockerfile) tags.push({ t:"Dockerfile" });
      if (s.compose) tags.push({ t:"docker-compose.yml" });
      s.containers.forEach(function(c){
        if (c.port) tags.push({ t:c.name + " " + c.port, cls: c.state === "a correr" ? "ok" : "" });
      });
    }
    if (tags.length){
      var extra = document.createElement("div");
      extra.className = "state-extra";
      extra.innerHTML = tags.map(function(t){
        return "<span class='state-tag " + (t.cls || "") + "'>" + escapeHtml(t.t) + "</span>";
      }).join("");
      box.appendChild(extra);
    }
    return box;
  }

  function renderBuilder(){
    var wrap = document.createDocumentFragment();
    var m = run.mission;

    var line = document.createElement("div");
    line.className = "cmdline";
    line.innerHTML = "<span class='prompt'>$</span>" +
      (run.tokens.length
        ? "<span>" + escapeHtml(run.tokens.join(" ")) + "</span>"
        : "<span class='empty'>toca nas pecas para montar o comando</span>") +
      "<span class='caret'></span>";
    wrap.appendChild(line);

    var actions = document.createElement("div");
    actions.className = "cmd-actions";
    var clearBtn = document.createElement("button");
    clearBtn.className = "btn-clear";
    clearBtn.textContent = "Apagar";
    clearBtn.onclick = function(){ run.tokens = []; run.feedback = null; render(); };
    var runBtn = document.createElement("button");
    runBtn.className = "btn-run";
    runBtn.textContent = "Executar";
    runBtn.disabled = run.tokens.length === 0;
    runBtn.onclick = function(){ execute(); };
    actions.appendChild(clearBtn);
    actions.appendChild(runBtn);
    wrap.appendChild(actions);

    var groups = document.createElement("div");
    groups.className = "token-groups";
    m.tokens.forEach(function(group){
      var g = document.createElement("div");
      g.className = "token-group";
      g.innerHTML = "<div class='token-group-name'>" + escapeHtml(group.name) + "</div>";
      var row = document.createElement("div");
      row.className = "tokens";
      group.items.forEach(function(item){
        var t = document.createElement("div");
        t.className = "token" + (item.cls ? " " + item.cls : "");
        t.textContent = item.t;
        t.onclick = function(){
          run.tokens.push(item.t);
          run.feedback = null;
          render();
        };
        row.appendChild(t);
      });
      g.appendChild(row);
      groups.appendChild(row.children.length ? g : document.createElement("div"));
    });
    wrap.appendChild(groups);
    return wrap;
  }

  function execute(){
    var m = run.mission;
    var step = m.steps[run.stepIndex];
    var typed = run.tokens.join(" ");
    var norm = normalize(typed);

    var accepted = step.accept.some(function(a){ return normalize(a) === norm; });

    if (accepted){
      var out = step.apply(run.state);
      run.log.push({ cmd: typed, out: out, type: step.outputType || "out" });
      run.tokens = [];
      run.showHint = false;
      run.feedback = step.explain ? { ok:true, text: step.explain } : null;
      run.stepIndex++;
      if (run.stepIndex >= m.steps.length){
        run.done = true;
        var stars = starsFor(run.errors, run.hintsUsed);
        var prev = progress[m.id];
        if (!prev || (prev.stars || 0) < stars){
          progress[m.id] = { stars: stars, done: true };
        } else {
          progress[m.id] = { stars: prev.stars, done: true };
        }
        saveProgress();
      }
      render();
      return;
    }

    run.errors++;
    var wrongMsg = null;
    if (step.wrong){
      for (var key in step.wrong){
        if (normalize(key) === norm){ wrongMsg = step.wrong[key]; break; }
      }
    }
    run.log.push({ cmd: typed, out: wrongMsg ? "" : "comando nao produz o efeito pretendido aqui", type:"err" });
    run.feedback = { ok:false, text: wrongMsg || "Esse comando nao e o que precisas neste passo. Le outra vez o que se pede, e usa a pista se precisares." };
    run.tokens = [];
    render();
  }

  function renderGlossary(){
    var wrap = document.createDocumentFragment();

    var filter = document.createElement("div");
    filter.className = "gloss-filter";
    ["git","gitlab","docker"].forEach(function(t){
      var d = document.createElement("div");
      d.className = (ui.glossTrack === t ? "active " + t : "");
      d.textContent = t === "git" ? "Git" : t === "gitlab" ? "GitLab" : "Docker";
      d.onclick = function(){ ui.glossTrack = t; render(); };
      filter.appendChild(d);
    });
    wrap.appendChild(filter);

    GLOSSARY.filter(function(g){ return g.track === ui.glossTrack; }).forEach(function(g){
      var item = document.createElement("div");
      item.className = "gloss-item";
      item.innerHTML =
        "<div class='gloss-cmd'>" + escapeHtml(g.cmd) + "</div>" +
        "<div class='gloss-desc'>" + escapeHtml(g.desc) + "</div>";
      wrap.appendChild(item);
    });
    return wrap;
  }

  function alertBox(message){
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;z-index:9998;background:rgba(8,10,14,.55);display:flex;align-items:center;justify-content:center;padding:24px;";
    var box = document.createElement("div");
    box.style.cssText = "background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:340px;width:100%;font-size:14px;line-height:1.55;font-family:inherit;";
    box.textContent = message;
    var btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.style.marginTop = "14px";
    btn.textContent = "OK";
    btn.onclick = function(){ overlay.remove(); };
    box.appendChild(btn);
    overlay.appendChild(box);
    overlay.onclick = function(e){ if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  initApp();
})();
</script>
