  function shareImage(buildCanvas){
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    return ready.then(function(){
      var canvas = buildCanvas();
      return canvasToBlob(canvas).then(function(blob){
        var file = null;
        if (blob && typeof File === "function"){
          try { file = new File([blob], "obras-de-casa.png", { type:"image/png" }); } catch(e){}
        }
        if (file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
          return navigator.share({ files:[file], title:"Obras de Casa" }).catch(function(){
            showImagePreview(canvas);
          });
        }
        showImagePreview(canvas);
      });
    }).catch(function(err){
      showAlert("Nao foi possivel gerar a imagem: " + (err && err.message ? err.message : err));
    });
  }

  function showImagePreview(canvas){
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;z-index:9998;background:rgba(10,12,11,.75);overflow:auto;padding:16px;";
    var box = document.createElement("div");
    box.style.cssText = "max-width:480px;margin:0 auto;";
    var hint = document.createElement("div");
    hint.textContent = "Mantem o dedo na imagem para guardar ou partilhar.";
    hint.style.cssText = "color:#fff;font-size:13px;text-align:center;margin-bottom:10px;";
    var img = document.createElement("img");
    img.src = canvas.toDataURL("image/png");
    img.style.cssText = "width:100%;border-radius:12px;display:block;";
    var close = document.createElement("button");
    close.textContent = "Fechar";
    close.className = "btn-primary";
    close.style.marginTop = "12px";
    close.onclick = function(){ overlay.remove(); };
    box.appendChild(hint);
    box.appendChild(img);
    box.appendChild(close);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  // ---------- lista de compras ----------
  function normalizeName(name){
    var text = String(name || "").trim().toLowerCase();
    if (text.normalize) text = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return text;
  }

  function shoppingTradeOf(entry){
    if (!entry.itemId) return null;
    var item = state.items.find(function(it){ return it.id === entry.itemId; });
    return item ? tradeById(item.trade) : null;
  }

  // Junta materiais com o mesmo nome numa so linha: interessa saber quanto
  // levar da loja, nao quantas vezes foi apontado.
  function buildShoppingGroups(){
    var groups = [];
    var index = {};

    state.shopping.forEach(function(entry){
      var trade = shoppingTradeOf(entry);
      var key = trade ? trade.id : "_geral";
      if (!index[key]){
        index[key] = { key:key, trade:trade, label: trade ? trade.label : "Geral", emoji: trade ? trade.emoji : "🛒", rows:[], rowIndex:{} };
        groups.push(index[key]);
      }
      var group = index[key];
      var rowKey = normalizeName(entry.name);
      if (!group.rowIndex[rowKey]){
        group.rowIndex[rowKey] = { name:entry.name, entries:[], quantities:[], codes:[] };
        group.rows.push(group.rowIndex[rowKey]);
      }
      var row = group.rowIndex[rowKey];
      row.entries.push(entry);
      if (entry.qty) row.quantities.push(entry.qty);
      var item = entry.itemId ? state.items.find(function(it){ return it.id === entry.itemId; }) : null;
      if (item) row.codes.push(itemCode(item));
    });

    groups.forEach(function(group){
      group.rows.forEach(function(row){
        row.checked = row.entries.every(function(e){ return e.checked; });
        row.qtyLabel = quantityLabel(row);
      });
      group.rows.sort(function(a,b){ return (a.checked === b.checked) ? 0 : (a.checked ? 1 : -1); });
      group.pending = group.rows.filter(function(r){ return !r.checked; }).length;
    });

    groups.sort(function(a,b){
      if (a.key === "_geral") return 1;
      if (b.key === "_geral") return -1;
      return b.pending - a.pending;
    });
    return groups;
  }

  function quantityLabel(row){
    if (row.quantities.length === 0) return row.entries.length > 1 ? ("x" + row.entries.length) : "";
    var distinct = [];
    row.quantities.forEach(function(q){ if (distinct.indexOf(q) === -1) distinct.push(q); });
    if (distinct.length === 1){
      return row.quantities.length > 1 ? (distinct[0] + " x" + row.quantities.length) : distinct[0];
    }
    return distinct.join(" + ");
  }

  function setShoppingChecked(entries, value){
    if (ui.cloudMode && cloudDb){
      var writes = entries.map(function(e){ return cloudDb.collection("shopping").doc(e.id).update({ checked: value }); });
      withTimeout(Promise.all(writes), 8000).catch(function(err){
        if (isConnectivityError(err)) fallbackToLocal(function(){ entries.forEach(function(e){ e.checked = value; }); });
        else showDbError(err);
      });
    } else {
      entries.forEach(function(e){ e.checked = value; });
      render();
    }
  }

  function deleteShoppingEntries(entries){
    if (ui.cloudMode && cloudDb){
      var writes = entries.map(function(e){ return cloudDb.collection("shopping").doc(e.id).delete(); });
      withTimeout(Promise.all(writes), 8000).catch(function(err){
        if (isConnectivityError(err)){
          fallbackToLocal(function(){
            var ids = entries.map(function(e){ return e.id; });
            state.shopping = state.shopping.filter(function(x){ return ids.indexOf(x.id) === -1; });
          });
        } else showDbError(err);
      });
    } else {
      var ids = entries.map(function(e){ return e.id; });
      state.shopping = state.shopping.filter(function(x){ return ids.indexOf(x.id) === -1; });
      render();
    }
  }

  function shoppingStats(){
    var groups = buildShoppingGroups();
    var rows = [];
    groups.forEach(function(g){ rows = rows.concat(g.rows); });
    var done = rows.filter(function(r){ return r.checked; }).length;
    return {
      groups: groups,
      totalRows: rows.length,
      done: done,
      pending: rows.length - done,
      pct: rows.length === 0 ? 0 : Math.round((done / rows.length) * 100)
    };
  }

  function renderShopping(){
    var wrap = document.createDocumentFragment();
    var stats = shoppingStats();

    var addRow = document.createElement("div");
    addRow.className = "add-row";
    addRow.style.border = "1px dashed var(--line)";
    addRow.style.borderRadius = "11px";
    addRow.style.marginBottom = "14px";
    addRow.innerHTML = "<span>+</span><span>Adicionar material</span>";
    addRow.onclick = function(){ openManualShoppingSheet(); };
    wrap.appendChild(addRow);

    if (stats.totalRows === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Lista vazia. Os materiais que indicares em cada arranjo aparecem aqui automaticamente.";
      wrap.appendChild(empty);
      return wrap;
    }

    var tiles = document.createElement("div");
    tiles.className = "stat-row";
    tiles.innerHTML =
      "<div class='stat-tile'><div class='stat-num'>" + stats.pending + "</div><div class='stat-lbl'>Por comprar</div></div>" +
      "<div class='stat-tile'><div class='stat-num'>" + stats.done + "</div><div class='stat-lbl'>Ja comprado</div></div>" +
      "<div class='stat-tile'><div class='stat-num'>" + stats.pct + "<span class='pct'>%</span></div><div class='stat-lbl'>Feito</div></div>";
    wrap.appendChild(tiles);

    var progress = document.createElement("div");
    progress.className = "progress-block";
    progress.style.marginBottom = "6px";
    progress.innerHTML = "<div class='progress-track'><div class='progress-done' style='width:" + stats.pct + "%'></div></div>";
    wrap.appendChild(progress);

    stats.groups.forEach(function(group){
      var card = document.createElement("div");
      card.className = "summary-card";

      var head = document.createElement("div");
      head.className = "summary-head";
      head.innerHTML =
        "<div class='summary-code'>" + (group.trade ? group.trade.code : "GER") + "</div>" +
        "<div class='summary-title'>" +
          "<div class='name'>" + escapeHtml(group.label) + "</div>" +
          "<div class='who'>" + (group.trade ? escapeHtml(group.trade.who) : "Materiais avulso") + "</div>" +
        "</div>" +
        "<div class='summary-count'>" + group.pending + "</div>";
      card.appendChild(head);

      var body = document.createElement("div");
      body.className = "shop-body";
      group.rows.forEach(function(row){ body.appendChild(renderShopRow(row)); });
      card.appendChild(body);

      var copyLink = document.createElement("div");
      copyLink.className = "trade-copy";
      copyLink.textContent = "Copiar so " + group.label.toLowerCase();
      copyLink.onclick = function(){
        copyTextWithFeedback(shoppingAsText(group.key), copyLink, "Copiar so " + group.label.toLowerCase());
      };
      card.appendChild(copyLink);

      wrap.appendChild(card);
    });

    var actions = document.createElement("div");
    actions.className = "summary-actions";

    var shareBtn = document.createElement("button");
    shareBtn.className = "btn-primary";
    shareBtn.textContent = "Partilhar como imagem";
    shareBtn.onclick = function(){
      shareBtn.disabled = true;
      shareBtn.textContent = "A preparar...";
      shareImage(buildShoppingCanvas).catch(function(){}).then(function(){
        shareBtn.disabled = false;
        shareBtn.textContent = "Partilhar como imagem";
      });
    };
    actions.appendChild(shareBtn);

    var copyBtn = document.createElement("button");
    copyBtn.className = "btn-secondary";
    copyBtn.textContent = "Copiar como texto";
    copyBtn.onclick = function(){ copyTextWithFeedback(shoppingAsText(), copyBtn, "Copiar como texto"); };
    actions.appendChild(copyBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  function copyTextWithFeedback(text, el, originalLabel){
    var done = function(){
      el.textContent = "Copiado";
      setTimeout(function(){ el.textContent = originalLabel; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ showAlert(text); });
    } else {
      showAlert(text);
    }
  }

  function renderShopRow(row){
    var el = document.createElement("div");
    el.className = "shop-line";

    var check = document.createElement("div");
    check.className = "check" + (row.checked ? " checked" : "");
    check.innerHTML = row.checked ? "&#10003;" : "";
    check.onclick = function(){ setShoppingChecked(row.entries, !row.checked); };
    el.appendChild(check);

    var main = document.createElement("div");
    main.className = "shop-main";
    main.innerHTML =
      "<div class='shop-name" + (row.checked ? " checked" : "") + "'>" + escapeHtml(row.name) + "</div>" +
      (row.codes.length ? "<div class='shop-origin'>" + row.codes.join(", ") + "</div>" : "");
    el.appendChild(main);

    if (row.qtyLabel){
      var qty = document.createElement("div");
      qty.className = "shop-qty";
      qty.textContent = row.qtyLabel;
      el.appendChild(qty);
    }

    var del = document.createElement("div");
    del.className = "shop-del";
    del.innerHTML = "&#10005;";
    del.onclick = function(){ deleteShoppingEntries(row.entries); };
    el.appendChild(del);

    return el;
  }

  function shoppingAsText(groupKey){
    var stats = shoppingStats();
    var groups = stats.groups.filter(function(g){ return !groupKey || g.key === groupKey; });
    if (groups.length === 0) return "Lista de compras vazia.";

    var hoje = new Date().toLocaleDateString("pt-PT", { day:"2-digit", month:"long", year:"numeric" });
    var lines = ["*OBRAS DE CASA*"];
    lines.push("_Lista de compras · " + hoje + "_");
    lines.push("");
    if (!groupKey){
      lines.push("🛒 *" + stats.pending + "* por comprar");
      if (stats.done > 0) lines.push("✅ *" + stats.done + "* ja comprados  " + blocksBar(stats.pct, 100, 10, true));
      lines.push("");
    }

    groups.forEach(function(group){
      lines.push("*" + group.emoji + " " + group.label.toUpperCase() + "*");
      group.rows.forEach(function(row){
        var mark = row.checked ? "☑" : "☐";
        var qty = row.qtyLabel ? "  ·  " + row.qtyLabel : "";
        var codes = row.codes.length ? "  (" + row.codes.join(", ") + ")" : "";
        lines.push(mark + " " + row.name + qty + codes);
      });
      lines.push("");
    });

    lines.push("_Os codigos (A1, B2...) dizem em que arranjo o material vai ser usado._");
    return lines.join("\n");
  }

  function renderTabbar(){
    var bar = document.createElement("div");
    bar.className = "tabbar";

    var tabObras = document.createElement("div");
    tabObras.className = "tab" + (ui.tab === "obras" ? " active" : "");
    tabObras.innerHTML = houseIcon() + "<span>Obras</span>";
    tabObras.onclick = function(){ ui.tab = "obras"; render(); };

    var tabResumo = document.createElement("div");
    tabResumo.className = "tab" + (ui.tab === "resumo" ? " active" : "");
    tabResumo.innerHTML = listIcon() + "<span>Resumo</span>";
    tabResumo.onclick = function(){ ui.tab = "resumo"; render(); };

    var tabCompras = document.createElement("div");
    tabCompras.className = "tab" + (ui.tab === "compras" ? " active" : "");
    var pendingCount = state.shopping.filter(function(s){ return !s.checked; }).length;
    tabCompras.innerHTML = cartIcon() + "<span>Compras</span>" + (pendingCount ? "<span class='tab-badge'>" + pendingCount + "</span>" : "");
    tabCompras.onclick = function(){ ui.tab = "compras"; render(); };

    bar.appendChild(tabObras);
    bar.appendChild(tabResumo);
    bar.appendChild(tabCompras);

  }
  function listIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>';
  }
  function cartIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.1a1.6 1.6 0 0 0 1.6 1.3h7.9a1.6 1.6 0 0 0 1.6-1.3L20 8H6"/></svg>';

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ---------- sheets ----------
  var scrim = document.getElementById("scrim");
  var sheet = document.getElementById("sheet");
  var sheetTitle = document.getElementById("sheetTitle");
  var sheetBody = document.getElementById("sheetBody");
  document.getElementById("sheetClose").onclick = closeSheet;
  scrim.onclick = closeSheet;

  function openSheet(title){
    sheetTitle.textContent = title;
    scrim.classList.add("show");
    requestAnimationFrame(function(){ sheet.classList.add("show"); });
  }
  function closeSheet(){
    sheet.classList.remove("show");
    scrim.classList.remove("show");
    setTimeout(function(){ sheetBody.innerHTML = ""; }, 200);
  }

  // O gesto mais repetido e registar um arranjo, nao criar divisoes: o
  // botao + vai directo ao item e so pergunta a area quando ha duvida.
  function startNewItem(){
    var areas = areasSorted();
    if (areas.length === 0){ openAreaSheet(); return; }
    if (areas.length === 1){ openItemSheet(areas[0].id, null); return; }
    if (ui.openAreaId && areas.some(function(a){ return a.id === ui.openAreaId; })){
      openItemSheet(ui.openAreaId, null);
      return;
    }
    openAreaPickerSheet();
  }

  function openAreaPickerSheet(){
    openSheet("Em que divisao?");
    var areas = areasSorted();
    sheetBody.innerHTML =
      "<div class='area-picker' id='areaPicker'>" +
      areas.map(function(a){
        var count = allItemsForArea(a.id).length;
        return "<div class='picker-opt' data-area='" + a.id + "'>" +
          "<span class='picker-letter'>" + a.letter + "</span>" +
          "<span class='picker-name'>" + escapeHtml(a.name) + "</span>" +
          "<span class='picker-count'>" + (count === 0 ? "sem itens" : count + " " + (count === 1 ? "item" : "itens")) + "</span>" +
        "</div>";
      }).join("") +
      "</div>" +
      "<div class='add-material' id='pickerNewArea' style='margin-top:12px;'><span>+</span><span>Criar nova divisao</span></div>";

    document.getElementById("areaPicker").querySelectorAll(".picker-opt").forEach(function(el){
      el.onclick = function(){
        var areaId = el.getAttribute("data-area");
        ui.openAreaId = areaId;
        openItemSheet(areaId, null);
      };
    });
    document.getElementById("pickerNewArea").onclick = function(){ openAreaSheet(); };
  }

  function openAreaSheet(){
    openSheet("Nova area");
    var nextLetter = nextAreaLetter(state.areas);
    sheetBody.innerHTML =
      "<label class='field'><span class='lbl'>Nome da divisao</span>" +
      "<input type='text' id='areaName' placeholder='Ex.: Cozinha, Sala, Quarto'></label>" +
      "<div class='hint'>Esta area fica identificada como <span class='code-chip'>Area " + nextLetter + "</span>. Os itens dentro dela ficam " + nextLetter + "1, " + nextLetter + "2, e assim por diante.</div>" +
      "<button class='btn-primary' id='saveArea' disabled>Guardar</button>";

    var input = document.getElementById("areaName");
    var btn = document.getElementById("saveArea");
    input.addEventListener("input", function(){ btn.disabled = input.value.trim().length === 0; });
    btn.onclick = function(){
      var name = input.value.trim();
      if (!name) return;
      var id = uid();
      var data = { letter: nextAreaLetter(state.areas), name:name, order: state.areas.length, example:false };
      if (ui.cloudMode && cloudDb){
        btn.disabled = true; btn.textContent = "A guardar...";
        withTimeout(cloudDb.collection("areas").doc(id).set(data), 6000).then(function(){
          ui.openAreaId = id;
          closeSheet();
        }).catch(function(err){
          if (isConnectivityError(err)){
            data.id = id;
            fallbackToLocal(function(){ state.areas.push(data); ui.openAreaId = id; });
            closeSheet();
          } else {
            btn.disabled = false; btn.textContent = "Guardar"; showDbError(err);
          }
        });
      } else {
        data.id = id;
        state.areas.push(data);
        ui.openAreaId = id;
        closeSheet();
        render();
      }
    };
    setTimeout(function(){ input.focus(); }, 250);
  }

  var draftPhoto = null;
  var draftMaterials = [];

  function openItemSheet(areaId, itemId){
    var area = state.areas.find(function(a){ return a.id === areaId; });
    var editing = itemId ? state.items.find(function(it){ return it.id === itemId; }) : null;
    draftPhoto = editing ? editing.photo : null;
    draftMaterials = editing
      ? state.shopping.filter(function(s){ return s.itemId === editing.id; }).map(function(s){ return { name:s.name, qty:s.qty }; })
      : [];

    var code = editing ? itemCode(editing) : (area.letter + nextItemNumber(state.items, areaId));
    openSheet(editing ? ("Editar " + code) : "Novo item");

    var selectedTrade = editing ? editing.trade : (ui.filterTrade || "alvenaria");
    var selectedDefect = editing ? editing.defect : tradeById(selectedTrade).defects[0].id;
    var selectedStatus = editing ? editing.status : "pendente";
    var selectedPriority = editing ? (editing.priority || "normal") : "normal";

    var tradeGrid = TRADES.map(function(t){
      var active = selectedTrade === t.id;
      return "<div class='code-opt" + (active ? " active" : "") + "' data-trade='" + t.id + "'><span class='sw'>" + t.code + "</span>" + t.label + "</div>";
    }).join("");

    var statusGrid = STATUSES.map(function(s){
      var active = selectedStatus === s.id;
      return "<div class='status-opt" + (active ? " active" : "") + "' data-status='" + s.id + "'>" + s.label + "</div>";
    }).join("");

    var priorityGrid = PRIORITIES.map(function(p){
      var active = selectedPriority === p.id;
      return "<div class='status-opt" + (active ? " active" : "") + "' data-priority='" + p.id + "'>" + p.label + "</div>";
    }).join("");

    sheetBody.innerHTML =
      "<label class='field'><span class='lbl'>Codigo</span><div class='code-chip'>" + code + "</div></label>" +
      "<label class='field'><span class='lbl'>Especialidade (quem arranja)</span><div class='code-grid' id='tradeGrid'>" + tradeGrid + "</div></label>" +
      "<label class='field'><span class='lbl'>Tipo de defeito</span><div class='defect-list' id='defectList'></div></label>" +
      "<div class='field' id='photoField'></div>" +
      "<label class='field'><span class='lbl'>Descricao</span><input type='text' id='itemDesc' placeholder='Ex.: Buraco junto a janela, lado esquerdo' value='" + (editing ? escapeAttr(editing.desc) : "") + "'></label>" +
      "<label class='field'><span class='lbl'>Notas</span><textarea id='itemNotes' placeholder='Medidas, referencias, o que combinaste'>" + (editing ? escapeHtml(editing.notes) : "") + "</textarea></label>" +
      "<label class='field'><span class='lbl'>Prioridade</span><div class='status-grid' id='priorityGrid'>" + priorityGrid + "</div></label>" +
      "<label class='field'><span class='lbl'>Estado</span><div class='status-grid' id='statusGrid'>" + statusGrid + "</div></label>" +
      "<label class='field'><span class='lbl'>Materiais para a lista de compras</span>" +
      "<div class='materials-list' id='materialsList'></div>" +
      "<div class='add-material' id='addMaterial'><span>+</span><span>Adicionar material</span></div></label>" +
      "<button class='btn-primary' id='saveItem'>Guardar</button>" +
      (editing ? "<button class='btn-danger' id='deleteItem'>Eliminar item</button>" : "");

    function renderDefectList(){
      var listEl = document.getElementById("defectList");
      if (!listEl) return;
      listEl.innerHTML = tradeById(selectedTrade).defects.map(function(d){
        var active = selectedDefect === d.id;
        return "<div class='defect-opt" + (active ? " active" : "") + "' data-defect='" + d.id + "'>" + d.label + "</div>";
      }).join("");
      listEl.querySelectorAll(".defect-opt").forEach(function(el){
        el.onclick = function(){
          selectedDefect = el.getAttribute("data-defect");
          listEl.querySelectorAll(".defect-opt").forEach(function(o){ o.classList.remove("active"); });
          el.classList.add("active");
        };
      });
    }

    var tradeGridEl = document.getElementById("tradeGrid");
    tradeGridEl.querySelectorAll(".code-opt").forEach(function(el){
      el.onclick = function(){
        selectedTrade = el.getAttribute("data-trade");
        selectedDefect = tradeById(selectedTrade).defects[0].id;
        tradeGridEl.querySelectorAll(".code-opt").forEach(function(o){ o.classList.remove("active"); });
        el.classList.add("active");
        renderDefectList();
      };
    });
    renderDefectList();

    var priorityGridEl = document.getElementById("priorityGrid");
    priorityGridEl.querySelectorAll(".status-opt").forEach(function(el){
      el.onclick = function(){
        selectedPriority = el.getAttribute("data-priority");
        priorityGridEl.querySelectorAll(".status-opt").forEach(function(o){ o.classList.remove("active"); });
        el.classList.add("active");
      };
    });

    var statusGridEl = document.getElementById("statusGrid");
    statusGridEl.querySelectorAll(".status-opt").forEach(function(el){
      el.onclick = function(){
        selectedStatus = el.getAttribute("data-status");
        statusGridEl.querySelectorAll(".status-opt").forEach(function(o){ o.classList.remove("active"); });
        el.classList.add("active");
      };
    });

    renderPhotoField();
    renderMaterialsList();

    document.getElementById("addMaterial").onclick = function(){
      draftMaterials.push({ name:"", qty:"" });
      renderMaterialsList();
    };

    document.getElementById("saveItem").onclick = function(){
      var desc = document.getElementById("itemDesc").value.trim();
      var notes = document.getElementById("itemNotes").value.trim();
      var cleanMaterials = draftMaterials
        .map(function(m){ return { name:m.name.trim(), qty:m.qty.trim() }; })
        .filter(function(m){ return m.name.length > 0; });
      var number = editing ? editing.number : nextItemNumber(state.items, areaId);
      var itemData = { areaId:areaId, number:number, trade:selectedTrade, defect:selectedDefect, priority:selectedPriority, desc:desc, notes:notes, status:selectedStatus, photo:draftPhoto, example:false };
      var saveBtn = this;

      if (ui.cloudMode && cloudDb){
        saveBtn.disabled = true; saveBtn.textContent = "A guardar...";
        withTimeout(saveItemToCloud(cloudDb, editing ? editing.id : null, areaId, itemData, cleanMaterials), 8000)
          .then(function(){ closeSheet(); })
          .catch(function(err){
            if (isConnectivityError(err)){
              fallbackToLocal(function(){
                if (editing){
                  itemData.id = editing.id;
                  state.items = state.items.map(function(it){ return it.id === editing.id ? itemData : it; });
                  state.shopping = state.shopping.filter(function(s){ return s.itemId !== editing.id; });
                } else {
                  itemData.id = uid();
                  state.items.push(itemData);
                }
                cleanMaterials.forEach(function(m){
                  state.shopping.push({ id:uid(), name:m.name, qty:m.qty, checked:false, itemId:itemData.id, example:false });
                });
              });
              closeSheet();
            } else {
              saveBtn.disabled = false; saveBtn.textContent = "Guardar"; showDbError(err);
            }
          });
      } else {
        if (editing){
          itemData.id = editing.id;
          state.items = state.items.map(function(it){ return it.id === editing.id ? itemData : it; });
          state.shopping = state.shopping.filter(function(s){ return s.itemId !== editing.id; });
          cleanMaterials.forEach(function(m){
            state.shopping.push({ id:uid(), name:m.name, qty:m.qty, checked:false, itemId:editing.id, example:false });
          });
        } else {
          itemData.id = uid();
          state.items.push(itemData);
          cleanMaterials.forEach(function(m){
            state.shopping.push({ id:uid(), name:m.name, qty:m.qty, checked:false, itemId:itemData.id, example:false });
          });
        }
        closeSheet();
        render();
      }
    };

    if (editing){
      document.getElementById("deleteItem").onclick = function(){
        if (ui.cloudMode && cloudDb){
          withTimeout(deleteItemFromCloud(cloudDb, editing.id), 8000).then(function(){ closeSheet(); }).catch(function(err){
            if (isConnectivityError(err)){
              fallbackToLocal(function(){
                state.items = state.items.filter(function(it){ return it.id !== editing.id; });
                state.shopping = state.shopping.filter(function(s){ return s.itemId !== editing.id; });
              });
              closeSheet();
            } else {
              showDbError(err);
            }
          });
        } else {
          state.items = state.items.filter(function(it){ return it.id !== editing.id; });
          state.shopping = state.shopping.filter(function(s){ return s.itemId !== editing.id; });
          closeSheet();
          render();
        }
      };
    }
  }

        "<div class='photo-btn' id='btnCamera'>Tirar foto</div>" +
        "<div class='photo-btn' id='btnLibrary'>Da galeria</div>" +
        "</div>";
      document.getElementById("btnCamera").onclick = function(){ document.getElementById("cameraInput").click(); };
      document.getElementById("btnLibrary").onclick = function(){ document.getElementById("libraryInput").click(); };
    }

  function renderMaterialsList(){
    var list = document.getElementById("materialsList");
    if (!list) return;
    list.innerHTML = "";
    draftMaterials.forEach(function(m, idx){
      var row = document.createElement("div");
      row.className = "material-row";
      row.innerHTML =
        "<input type='text' placeholder='Ex.: Massa de vidraceiro' value='" + escapeAttr(m.name) + "'>" +
        "<input type='text' class='qty' placeholder='Qtd.' value='" + escapeAttr(m.qty) + "'>" +
        "<span class='rm'>&#10005;</span>";
      var inputs = row.querySelectorAll("input");
      inputs[0].oninput = function(){ draftMaterials[idx].name = inputs[0].value; };
      inputs[1].oninput = function(){ draftMaterials[idx].qty = inputs[1].value; };
      row.querySelector(".rm").onclick = function(){ draftMaterials.splice(idx,1); renderMaterialsList(); };
      list.appendChild(row);
    });
  }

  function openManualShoppingSheet(){
    openSheet("Novo material");
    sheetBody.innerHTML =
      "<label class='field'><span class='lbl'>Material</span><input type='text' id='manName' placeholder='Ex.: Fita isoladora'></label>" +
      "<label class='field'><span class='lbl'>Quantidade</span><input type='text' id='manQty' placeholder='Ex.: 2 un.'></label>" +
      "<button class='btn-primary' id='saveMan' disabled>Adicionar</button>";
    var name = document.getElementById("manName");
    var qty = document.getElementById("manQty");
    var btn = document.getElementById("saveMan");
    name.addEventListener("input", function(){ btn.disabled = name.value.trim().length === 0; });
    btn.onclick = function(){
      if (!name.value.trim()) return;
      var data = { name:name.value.trim(), qty:qty.value.trim(), checked:false, itemId:null, example:false };
      var newId = uid();
      if (ui.cloudMode && cloudDb){
        btn.disabled = true; btn.textContent = "A guardar...";
        withTimeout(cloudDb.collection("shopping").doc(newId).set(data), 6000).then(function(){ closeSheet(); })
          .catch(function(err){
            if (isConnectivityError(err)){
              data.id = newId;
              fallbackToLocal(function(){ state.shopping.push(data); });
              closeSheet();
            } else {
              btn.disabled = false; btn.textContent = "Adicionar"; showDbError(err);
            }
          });
      } else {
        data.id = newId;
        state.shopping.push(data);
        closeSheet();
        render();
      }
    };
    setTimeout(function(){ name.focus(); }, 250);
  }

  function escapeAttr(s){ return escapeHtml(s).replace(/\n/g, " "); }

  function openBackupSheet(){
    openSheet("Copia de seguranca");
    var json = JSON.stringify(state, null, 2);
    var stamp = new Date().toLocaleDateString("pt-PT");
    var introText = ui.cloudMode
      ? "Os teus dados ja ficam guardados na tua conta Claude e sincronizados. Esta copia e so um extra, para teres tambem um ficheiro teu."
      : "Guarda este texto num sitio seguro (Notas, Ficheiros, email) de vez em quando. Se o Safari limpar os dados, usa o botao Restaurar aqui em baixo para recuperar tudo.";
    var restoreLabel = ui.cloudMode ? "Restaurar (acrescenta a conta, nao apaga nada)" : "Restaurar (substitui os dados atuais)";
    sheetBody.innerHTML =
      "<div class='hint' style='margin-bottom:14px;'>" + introText + "</div>" +
      "<label class='field'><span class='lbl'>Exportar (" + stamp + ")</span>" +
      "<textarea id='backupOut' readonly rows='6' style='font-family:\"IBM Plex Mono\";font-size:11px;'></textarea></label>" +
      "<button class='btn-primary' id='copyBackup'>Copiar copia de seguranca</button>" +
      "<div class='section-label' style='margin-top:22px;'>Restaurar</div>" +
      "<label class='field'><span class='lbl'>Cola aqui uma copia de seguranca guardada</span>" +
      "<textarea id='backupIn' rows='6' placeholder='Cola aqui o texto que copiaste antes' style='font-family:\"IBM Plex Mono\";font-size:11px;'></textarea></label>" +
      "<button class='btn-danger' id='restoreBackup' style='border-color:var(--line);color:var(--ink-soft);'>" + restoreLabel + "</button>";

    document.getElementById("backupOut").value = json;

    document.getElementById("copyBackup").onclick = function(){
      var out = document.getElementById("backupOut");
      var btn = document.getElementById("copyBackup");
      var done = function(){ btn.textContent = "Copiado"; setTimeout(function(){ btn.textContent = "Copiar copia de seguranca"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(out.value).then(done).catch(function(){ out.select(); document.execCommand("copy"); done(); });
      } else {
        out.select();
        document.execCommand("copy");
        done();
      }
    };

    document.getElementById("restoreBackup").onclick = function(){
      var text = document.getElementById("backupIn").value.trim();
      if (!text) return;
      var parsed;
      try { parsed = JSON.parse(text); }
      catch(e){ showAlert("Este texto nao parece uma copia de seguranca valida."); return; }
      if (!parsed || !Array.isArray(parsed.areas) || !Array.isArray(parsed.items)){
        showAlert("Este texto nao parece uma copia de seguranca valida.");
        return;
      }
      var restoreBtn = document.getElementById("restoreBackup");
      if (ui.cloudMode && cloudDb){
        showConfirm("Isto acrescenta os itens desta copia de seguranca aos que ja tens guardados na conta (nao apaga nada). Continuar?", function(){
          restoreBtn.disabled = true; restoreBtn.textContent = "A restaurar...";
          withTimeout(importIntoCloud(cloudDb, parsed), 12000).then(function(){ closeSheet(); })
            .catch(function(err){
              if (isConnectivityError(err)){
                fallbackToLocal(function(){
                  state.areas = parsed.areas || [];
                  state.items = parsed.items || [];
                  state.shopping = parsed.shopping || [];
                });
                closeSheet();
              } else {
                restoreBtn.disabled = false; restoreBtn.textContent = "Restaurar (acrescenta a conta, nao apaga nada)"; showDbError(err);
              }
            });
        }, "Restaurar");
      } else {
        showConfirm("Isto substitui tudo o que esta na app agora pelos dados da copia de seguranca. Continuar?", function(){
          state.areas = parsed.areas || [];
          state.items = parsed.items || [];
          state.shopping = parsed.shopping || [];
          closeSheet();
          render();
        }, "Restaurar");
      }
    };
  }

  // ---------- photo capture ----------
  function handleFile(file){
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 760;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        draftPhoto = canvas.toDataURL("image/jpeg", 0.52);
        renderPhotoField();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  document.getElementById("cameraInput").addEventListener("change", function(e){
    handleFile(e.target.files[0]); e.target.value = "";
  });
  document.getElementById("libraryInput").addEventListener("change", function(e){
    handleFile(e.target.files[0]); e.target.value = "";
  });

  initApp();
})();
</script>
